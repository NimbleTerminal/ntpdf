version: '3'

env:
  GOWORK: 'off'

tasks:
  default:
    desc: 'Default task runs the "build" task'
    deps:
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

###############################################################################

  go-tidy:
    desc: 'Go tidy all the things'
    run: once
    cmds:
      - go mod tidy

  go-update:
    desc: 'Go update all the dependencies'
    run: once
    cmds:
      - go get -u ./...
      - go get -u tool
      - go mod tidy

  test:
    desc: 'Run fast Go unit tests'
    cmds:
      - go test ./...

  test-all:
    desc: 'Run all Go tests including wazero integration'
    cmds:
      - go test -tags=integration ./...

  test-wasm:
    desc: 'Run all Go tests under Node WASM'
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
    cmds:
      - 'go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./...'

  vet:
    desc: 'Run go vet'
    cmds:
      - go vet ./...

  build:
    desc: 'Build library and native examples'
    cmds:
      - go build ./...
      - task: build-examples

  clean:
    desc: 'Clean built examples and generated site artifacts'
    deps:
      - clean-wasm-site
    cmds:
      - rm -rf bin .task

###############################################################################
# Examples

  run-pdfview:
    desc: 'Run the single-pane PDF viewer demo'
    cmds: ['go run ./examples/pdfview']

  build-examples:
    desc: 'Build all examples'
    deps:
      - build-ex-pdfview
      - build-ex-pagedims

  build-ex-pdfview:
    desc: 'Build the pdfview example'
    deps:
      - go-tidy
    cmds:
      - mkdir -p bin
      - go build -o bin/ntpdf-pdfview ./examples/pdfview
    sources:
      - '*.go'
      - examples/pdfview/*.go
      - examples/pdfview/testdata/Example.pdf
      - go.mod
    generates:
      - bin/ntpdf-pdfview

  build-ex-pagedims:
    desc: 'Build the aspect-matched-cellrect example'
    deps:
      - go-tidy
    cmds:
      - mkdir -p bin
      - go build -o bin/ntpdf-pagedims ./examples/pagedims
    sources:
      - '*.go'
      - examples/pagedims/*.go
      - go.mod
    generates:
      - bin/ntpdf-pagedims

###############################################################################
# Demo gif (note: Kitty graphics do not render in VHS — this captures the
# half-block path only; do a hand-made recording for Kitty-mode demos).

  vhs-validate:
    desc: 'Validate vhs tape file'
    cmds:
      - vhs validate ./examples/pdfview/demo.tape

  vhs:
    desc: 'Generate gif via vhs'
    deps:
      - build-ex-pdfview
    cmds:
      - vhs --output ./examples/pdfview/demo.gif ./examples/pdfview/demo.tape

###############################################################################
# Demo website via booba

  build-wasm:
    desc: 'Build browser WASM demo'
    deps: [go-tidy]
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p web/demos
      - go build -o web/demos/pdfview.wasm ./examples/pdfview

  build-wasm-site:
    desc: 'Build browser demo and export the pinned booba + pdfium runtime into web/'
    cmds:
      - task: build-wasm
      - go tool booba-assets --no-index web
      - go tool booba-shim-assets web/ --shim=pdfium
      - cp LICENSE.txt web/LICENSE
      - task: check-site

  check-site:
    desc: 'Check JavaScript syntax, site assets, and smoke-test WASM demo'
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
      - node scripts/smoke-demo.mjs pdfview

  serve-wasm-site:
    desc: 'Serve demos at http://localhost:8000/web/'
    cmds:
      - task: build-wasm-site
      - python3 -m http.server 8000 --bind 127.0.0.1

  clean-wasm-site:
    desc: 'Remove WASM demo site artifacts'
    cmds:
      - rm -rf web/demos web/booba web/ghostty-web web/booba-shim
      - rm -f web/wasm_exec.js web/app.wasm web/LICENSE
