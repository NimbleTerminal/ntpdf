version: '3'

env:
  GOWORK: 'off'

tasks:
  default:
    desc: 'Default task runs the "build" task'
    deps:
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

###############################################################################

  go-tidy:
    desc: 'Go tidy all the things'
    run: once
    cmds:
      - go mod tidy

  go-update:
    desc: 'Go update all the dependencies'
    run: once
    cmds:
      - go get -u ./...
      - go get -u tool
      - go mod tidy

  test:
    desc: 'Run all Go tests'
    cmds:
      - go test ./...

  test-integration:
    desc: 'Run integration tests including PDFium rendering'
    cmds:
      - go test -tags=integration ./...

  test-wasm:
    desc: 'Run all Go tests under Node WASM'
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
    cmds:
      - 'go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./...'

  vet:
    desc: 'Run go vet'
    cmds:
      - go vet ./...

  build:
    desc: 'Build library and native examples'
    cmds:
      - go build ./...
      - task: build-examples

  clean:
    desc: 'Clean built examples and generated site artifacts'
    deps:
      - clean-wasm-site
    cmds:
      - rm -rf bin .task

###############################################################################
# Examples

  run-gallery:
    desc: 'Run the multi-document PDF gallery demo'
    cmds: ['go run ./examples/gallery']

  run-report:
    desc: 'Run the live PDF report builder demo'
    cmds: ['go run ./examples/report']

  run-inspector:
    desc: 'Run the side-by-side Image + Text PDF inspector demo'
    cmds: ['go run ./examples/inspector']

  run-pagedims:
    desc: 'Run the aspect-matched viewport demo'
    cmds: ['go run ./examples/pagedims']

  run-pdfview:
    desc: 'Run the single-pane PDF viewer demo'
    cmds: ['go run ./examples/pdfview']

  build-examples:
    desc: 'Build all native demos'
    deps:
      - go-tidy
    cmds:
      - mkdir -p bin
      - for: [gallery, report, inspector, pagedims, pdfview]
        cmd: go build -o bin/ntpdf-{{.ITEM}} ./examples/{{.ITEM}}

  build-ex-pdfview:
    desc: 'Build the pdfview example'
    deps:
      - go-tidy
    cmds:
      - mkdir -p bin
      - go build -o bin/ntpdf-pdfview ./examples/pdfview

###############################################################################
# Demo website via booba

  build-wasm:
    desc: 'Build all browser WASM demos'
    deps: [go-tidy]
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p web/demos
      - for: [gallery, report, inspector, pagedims, pdfview]
        cmd: go build -o web/demos/{{.ITEM}}.wasm ./examples/{{.ITEM}}

  build-wasm-site:
    desc: 'Build browser demos and export the pinned booba runtime into web/'
    cmds:
      - task: build-wasm
      - go tool booba-assets --no-index web
      - go tool booba-shim-assets web/ --shim=pdfium
      - cp LICENSE.txt web/LICENSE
      - task: check-site

  check-site:
    desc: 'Check JavaScript syntax, site assets, and smoke-test all WASM demos'
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
      - for: [gallery, report, inspector, pagedims, pdfview]
        cmd: node scripts/smoke-demo.mjs {{.ITEM}}

  serve-wasm-site:
    desc: 'Serve demos at http://localhost:8000/web/'
    cmds:
      - task: build-wasm-site
      - python3 -m http.server 8000 --bind 127.0.0.1

  clean-wasm-site:
    desc: 'Remove generated WASM demo site artifacts'
    cmds:
      - rm -rf web/demos web/booba web/ghostty-web web/booba-shim
      - rm -f web/wasm_exec.js web/app.wasm web/LICENSE

###############################################################################
# Demo gif

  vhs-validate:
    desc: 'Validate vhs tape file'
    cmds:
      - vhs validate ./examples/pdfview/demo.tape

  vhs:
    desc: 'Generate gif via vhs'
    deps:
      - build-ex-pdfview
    cmds:
      - vhs --output ./examples/pdfview/demo.gif ./examples/pdfview/demo.tape
