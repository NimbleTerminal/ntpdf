name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GOWORK: 'off'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum
            wasm.work.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build WASM demo
        run: |
          mkdir -p web/demos
          GOWORK="$PWD/wasm.work" GOARCH=wasm GOOS=js CGO_ENABLED=0 go -C examples build -o ../web/demos/pdfview.wasm ./pdfview
      - name: Set up web assets
        run: |
          go -C examples tool booba-assets --no-index ../web
          go -C examples tool booba-shim-assets ../web/ --shim=pdfium
          cp LICENSE.txt web/LICENSE
      - name: Check site and smoke-test WASM demo
        run: |
          node --check web/site.js
          node scripts/check-site.mjs
          node scripts/smoke-demo.mjs pdfview
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
