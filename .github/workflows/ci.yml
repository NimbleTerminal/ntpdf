name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  GOWORK: 'off'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum
            wasm.work.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Vet
        run: |
          go vet ./...
          go -C examples vet ./...
      - name: Test
        run: |
          go test ./...
          go -C examples test ./...
      - name: Build library and examples
        run: |
          go build ./...
          go -C examples build ./...
      - name: Build WASM site
        run: |
          mkdir -p web/demos
          GOWORK="$PWD/wasm.work" GOARCH=wasm GOOS=js CGO_ENABLED=0 go -C examples build -o ../web/demos/pdfview.wasm ./pdfview
          go -C examples tool booba-assets --no-index ../web
          go -C examples tool booba-shim-assets ../web/ --shim=pdfium
          cp LICENSE.txt web/LICENSE
      - name: Check WASM site and smoke-test demo
        run: |
          node --check web/site.js
          node scripts/check-site.mjs
          node scripts/smoke-demo.mjs pdfview
      - name: Test browser picture transport
        run: GOWORK="$PWD/wasm.work" GOARCH=wasm GOOS=js go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" . -run TestBrowserSharedMemoryLifecycle -v
